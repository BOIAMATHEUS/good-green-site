<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Criativos · Good Green</title>
<link rel="icon" href="../assets/img/logo-petroNeon.svg">
<style>
@font-face{font-family:"GG Sans";src:url(../assets/fonts/GoodGreenSans-Light.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"GG Sans";src:url(../assets/fonts/GoodGreenSans-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"GG Sans";src:url(../assets/fonts/GoodGreenSans-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"GG Mono";src:url(../assets/fonts/GoodGreenMono-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
:root{--petroleo:#0F2E2F;--verde:#1D4535;--neon:#78F624;--osso:#F6F5F1;--linha:#E2DFD7;--mut:#667373;--branco:#fff;--chega:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:var(--neon);color:var(--petroleo)}
body{background:var(--osso);color:var(--petroleo);font:16px/1.5 "GG Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--petroleo);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}
.topo{padding:40px 0 28px;display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--linha)}
.volta{display:inline-flex;align-items:center;gap:10px;margin-bottom:28px}
.volta img{height:26px;display:block}
.volta span{font-family:"GG Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
h1{font-weight:300;font-size:clamp(36px,5vw,56px);line-height:1.02;letter-spacing:-.025em}
.sub{color:var(--mut);max-width:58ch;margin-top:12px}
.abas{display:flex;gap:6px;background:var(--branco);border:1px solid var(--linha);border-radius:999px;padding:4px}
.abas button{font-weight:500;font-size:14px;border-radius:999px;padding:9px 16px;transition:background-color .2s,color .2s}
.abas button:hover{background:var(--osso)}
.abas button[aria-selected="true"]{background:var(--petroleo);color:var(--branco)}
.abas small{font-family:"GG Mono",monospace;font-size:11px;opacity:.6;margin-left:6px}
.filtros{display:flex;flex-wrap:wrap;gap:8px;padding:24px 0 4px}
.filtros button{font-family:"GG Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--linha);background:var(--branco);border-radius:999px;padding:8px 13px;transition:border-color .15s,background-color .15s}
.filtros button:hover{border-color:var(--petroleo)}
.filtros button[aria-pressed="true"]{background:var(--neon);border-color:var(--neon)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:20px 0 56px;align-items:start}
.peca{display:block;width:100%;text-align:left;background:var(--branco);border-radius:16px;overflow:hidden;transition:transform .35s var(--chega),box-shadow .35s var(--chega)}
@media (hover:hover){.peca:hover{transform:translateY(-4px);box-shadow:0 22px 40px -26px rgba(15,46,47,.45)}}
.peca img{display:block;width:100%;height:auto;aspect-ratio:var(--r);object-fit:cover;background:var(--linha)}
.peca .leg{padding:12px 14px 14px;display:grid;gap:2px}
.peca b{font-weight:500;font-size:15px;line-height:1.3}
.peca code{font-family:"GG Mono",monospace;font-size:11.5px;color:var(--mut)}
.dia{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;margin-top:20px;padding-bottom:6px;border-bottom:1px solid var(--linha)}
.dia:first-child{margin-top:0}
.dia h2{font-weight:300;font-size:26px;letter-spacing:-.01em}
.dia span{font-family:"GG Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.feed{grid-template-columns:repeat(3,1fr);gap:4px;max-width:900px}
.feed .peca{border-radius:0}
.feed .peca .leg{display:none}
.feed .dia{margin-top:28px}
/* visualizador */
.vis{position:fixed;inset:0;z-index:10;display:grid;grid-template-rows:auto 1fr;background:rgba(9,24,25,.94);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.vis.aberto{opacity:1;visibility:visible;transition:opacity .25s}
.vis-barra{display:flex;align-items:center;gap:10px;padding:14px 18px;color:var(--branco)}
.vis-barra b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vis-barra code{font-family:"GG Mono",monospace;font-size:12px;opacity:.65}
.vis-barra a,.vis-barra button{color:var(--branco);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;transition:background-color .15s}
.vis-barra a:hover,.vis-barra button:hover{background:rgba(255,255,255,.12)}
.vis-palco{position:relative;display:grid;place-items:center;padding:0 64px 24px;min-height:0}
.vis-palco img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);transform:scale(.97);transition:transform .35s var(--chega)}
.vis.aberto .vis-palco img{transform:none}
.seta{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);color:var(--branco);font-size:22px;display:grid;place-items:center;transition:background-color .15s}
.seta:hover{background:rgba(255,255,255,.22)}
.seta.ant{left:12px}.seta.prox{right:12px}
@media (max-width:600px){.topo{padding-top:28px}.grade{grid-template-columns:repeat(2,1fr);gap:10px}.feed{gap:2px}.peca .leg{padding:9px 10px 11px}.peca b{font-size:13px}.vis-palco{padding:0 8px 16px}.seta{display:none}.vis-barra code{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="topo">
    <div>
      <a class="volta" href="./"><img src="../assets/img/logo-petroNeon.svg" alt="Good Green"><span>Hub</span></a>
      <h1>Criativos</h1>
      <p class="sub">Os anúncios do funil e os posts dos 15 primeiros dias do Instagram, exportados do Figma. Clique numa peça para ver em tamanho real e baixar.</p>
    </div>
    <div class="abas" role="tablist" aria-label="Tipo">
      <button role="tab" data-aba="anuncios" aria-selected="true">Anúncios<small id="n-a"></small></button>
      <button role="tab" data-aba="posts" aria-selected="false">Posts Instagram<small id="n-p"></small></button>
    </div>
  </header>
  <div class="filtros" id="filtros"></div>
  <main class="grade" id="grade"></main>
</div>
<div class="vis" id="vis" role="dialog" aria-modal="true" aria-label="Peça em tamanho real">
  <div class="vis-barra"><b id="vis-t"></b><code id="vis-c"></code><a id="vis-baixa" download>Baixar</a><button type="button" id="vis-fecha">Fechar</button></div>
  <div class="vis-palco"><button class="seta ant" type="button" aria-label="Anterior">‹</button><img id="vis-img" alt=""><button class="seta prox" type="button" aria-label="Próxima">›</button></div>
</div>
<script src="criativos.js"></script>
<script>
(function () {
  var A = window.GG_ANUNCIOS, P = window.GG_POSTS;
  var grade = document.getElementById('grade'), filtros = document.getElementById('filtros');
  var aba = 'anuncios', filtro = 'todos', lista = [];
  document.getElementById('n-a').textContent = A.length; document.getElementById('n-p').textContent = P.length;
  function peca(src, titulo, cod, r, i) {
    return '<button class="peca" type="button" data-i="' + i + '" style="--r:' + r + '"><img src="' + src.replace('.jpg', '-p.jpg') + '" alt="' + titulo.replace(/"/g, '&quot;') + '" loading="lazy" decoding="async"><span class="leg"><b>' + titulo + '</b><code>' + cod + '</code></span></button>';
  }
  function filtrosHtml(opcoes) {
    filtros.innerHTML = opcoes.map(function (o) { return '<button type="button" data-f="' + o[0] + '" aria-pressed="' + (o[0] === filtro) + '">' + o[1] + '</button>'; }).join('');
  }
  function desenha() {
    lista = []; var h = '';
    if (aba === 'anuncios') {
      var lps = ['todos'].concat(A.map(function (a) { return a.lp; }).filter(function (v, i, s) { return s.indexOf(v) === i; }));
      filtrosHtml(lps.map(function (l) { return [l, l === 'todos' ? 'Todos' : l]; }).concat([['4:5', 'Feed 4:5'], ['9:16', 'Stories 9:16']]));
      grade.className = 'grade';
      A.forEach(function (a) {
        if (filtro !== 'todos' && a.lp !== filtro && a.f !== filtro) return;
        var src = '../criativos/anuncios/' + a.id + '.jpg';
        lista.push({ src: src, t: a.t, c: a.id + ' · ' + a.lp + ' · ' + a.f });
        h += peca(src, a.t, a.id + ' · ' + a.lp + ' · ' + a.f, a.f === '4:5' ? '4/5' : '9/16', lista.length - 1);
      });
    } else {
      filtrosHtml([['todos', 'Por dia'], ['feed', 'Como fica no perfil']]);
      grade.className = 'grade' + (filtro === 'feed' ? ' feed' : '');
      var itens = P.slice(); if (filtro === 'feed') itens.reverse();
      var dia = '';
      itens.forEach(function (p) {
        var d = p.id.split('-')[0];
        if (d !== dia && filtro !== 'feed') { dia = d; h += '<div class="dia"><h2>Dia ' + (+d.slice(1)) + '</h2><span>3 posts</span></div>'; }
        var src = '../criativos/posts/' + p.id + '.jpg';
        lista.push({ src: src, t: 'Dia ' + (+d.slice(1)) + ' · post ' + p.id.split('-')[1], c: 'GG-POST-' + p.id });
        h += peca(src, 'Post ' + p.id.split('-')[1], 'GG-POST-' + p.id, '4/5', lista.length - 1);
      });
    }
    grade.innerHTML = h;
  }
  document.querySelectorAll('[data-aba]').forEach(function (b) {
    b.addEventListener('click', function () {
      aba = b.dataset.aba; filtro = 'todos';
      document.querySelectorAll('[data-aba]').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
      try { history.replaceState(null, '', '#' + aba); } catch (e) {}
      desenha();
    });
  });
  filtros.addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (!b) return; filtro = b.dataset.f; desenha(); });
  var vis = document.getElementById('vis'), img = document.getElementById('vis-img'), atual = 0, ultimo = null;
  function mostra(i) {
    atual = (i + lista.length) % lista.length; var it = lista[atual];
    img.src = it.src; img.alt = it.t; document.getElementById('vis-t').textContent = it.t; document.getElementById('vis-c').textContent = it.c;
    var b = document.getElementById('vis-baixa'); b.href = it.src; b.setAttribute('download', it.c.split(' ')[0] + '.jpg');
  }
  function abre(i) { ultimo = document.activeElement; mostra(i); vis.classList.add('aberto'); document.body.style.overflow = 'hidden'; document.getElementById('vis-fecha').focus(); }
  function fecha() { vis.classList.remove('aberto'); document.body.style.overflow = ''; if (ultimo) ultimo.focus(); }
  grade.addEventListener('click', function (e) { var b = e.target.closest('.peca'); if (b) abre(+b.dataset.i); });
  document.getElementById('vis-fecha').addEventListener('click', fecha);
  vis.querySelector('.ant').addEventListener('click', function () { mostra(atual - 1); });
  vis.querySelector('.prox').addEventListener('click', function () { mostra(atual + 1); });
  vis.addEventListener('click', function (e) { if (e.target === vis || e.target.classList.contains('vis-palco')) fecha(); });
  document.addEventListener('keydown', function (e) {
    if (!vis.classList.contains('aberto')) return;
    if (e.key === 'Escape') fecha(); else if (e.key === 'ArrowLeft') mostra(atual - 1); else if (e.key === 'ArrowRight') mostra(atual + 1);
  });
  var x0 = null;
  vis.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  vis.addEventListener('touchend', function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) mostra(atual + (dx < 0 ? 1 : -1)); x0 = null; });
  if (location.hash === '#posts') document.querySelector('[data-aba="posts"]').click(); else desenha();
})();
</script>
</body>
</html>
