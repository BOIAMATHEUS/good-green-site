<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Criativos · Good Green</title>
<link rel="icon" href="../assets/img/logo-petroNeon.svg">
<style>
@font-face{font-family:"GG Sans";src:url(../assets/fonts/GoodGreenSans-Light.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"GG Sans";src:url(../assets/fonts/GoodGreenSans-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"GG Sans";src:url(../assets/fonts/GoodGreenSans-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"GG Mono";src:url(../assets/fonts/GoodGreenMono-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
:root{--petroleo:#0F2E2F;--verde:#1D4535;--neon:#78F624;--osso:#F6F5F1;--linha:#E2DFD7;--mut:#667373;--branco:#fff;--chega:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:var(--neon);color:var(--petroleo)}
body{background:var(--osso);color:var(--petroleo);font:16px/1.5 "GG Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--petroleo);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}
.topo{padding:40px 0 28px;display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--linha)}
.volta{display:inline-flex;align-items:center;gap:10px;margin-bottom:28px}
.volta img{height:26px;display:block}
.volta span{font-family:"GG Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
h1{font-weight:300;font-size:clamp(36px,5vw,56px);line-height:1.02;letter-spacing:-.025em}
.sub{color:var(--mut);max-width:58ch;margin-top:12px}
.abas{display:flex;gap:6px;background:var(--branco);border:1px solid var(--linha);border-radius:999px;padding:4px}
.abas button{font-weight:500;font-size:14px;border-radius:999px;padding:9px 16px;transition:background-color .2s,color .2s}
.abas button:hover{background:var(--osso)}
.abas button[aria-selected="true"]{background:var(--petroleo);color:var(--branco)}
.abas small{font-family:"GG Mono",monospace;font-size:11px;opacity:.6;margin-left:6px}
.filtros{display:flex;flex-wrap:wrap;gap:8px;padding:24px 0 4px}
.filtros button{font-family:"GG Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--linha);background:var(--branco);border-radius:999px;padding:8px 13px;transition:border-color .15s,background-color .15s}
.filtros button:hover{border-color:var(--petroleo)}
.filtros button[aria-pressed="true"]{background:var(--neon);border-color:var(--neon)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:20px 0 56px;align-items:start}
.peca{display:block;width:100%;text-align:left;background:var(--branco);border-radius:16px;overflow:hidden;transition:transform .35s var(--chega),box-shadow .35s var(--chega)}
@media (hover:hover){.peca:hover{transform:translateY(-4px);box-shadow:0 22px 40px -26px rgba(15,46,47,.45)}}
.peca img{display:block;width:100%;height:auto;aspect-ratio:var(--r);object-fit:cover;background:var(--linha)}
.peca .leg{padding:12px 14px 14px;display:grid;gap:2px}
.peca b{font-weight:500;font-size:15px;line-height:1.3}
.peca code{font-family:"GG Mono",monospace;font-size:11.5px;color:var(--mut)}
.dia{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;margin-top:20px;padding-bottom:6px;border-bottom:1px solid var(--linha)}
.dia:first-child{margin-top:0}
.dia h2{font-weight:300;font-size:26px;letter-spacing:-.01em}
.dia span{font-family:"GG Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.feed{grid-template-columns:repeat(3,1fr);gap:4px;max-width:900px}
.feed .peca{border-radius:0}
.feed .peca .leg{display:none}
.feed .dia{margin-top:28px}
/* perfil no instagram */
.perfil-wrap{display:grid;grid-template-columns:minmax(0,auto) minmax(0,360px);justify-content:center;gap:56px;align-items:start;padding:28px 0 64px}
.ig-cel{width:400px;padding:12px;border-radius:58px;background:linear-gradient(160deg,#2a3b3b,#0c1717 60%);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 40px 90px -30px rgba(15,46,47,.6);position:relative}
.ig-cel::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:20px;background:#000;z-index:3}
.ig{height:820px;overflow-y:auto;scrollbar-width:none;border-radius:46px;background:#fff;color:#000;font:14px/1.35 -apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.ig::-webkit-scrollbar{display:none}
.ig-status{height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0;font-weight:600;font-size:15px;position:sticky;top:0;background:#fff;z-index:2}
.ig-status svg{width:44px;height:14px}
.ig-topo{display:flex;align-items:center;gap:6px;padding:6px 16px 10px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.ig-topo svg{width:22px;height:22px}
.ig-topo .vf{width:16px;height:16px;margin-left:-2px}
.ig-topo .dir{margin-left:auto;display:flex;gap:20px}
.ig-cab{display:flex;align-items:center;gap:20px;padding:4px 16px 12px}
.ig-av{flex:0 0 86px;height:86px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,#78F624,#1D4535,#78F624)}
.ig-av span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#0F2E2F;border:3px solid #fff}
.ig-av img{width:60px}
.ig-num{flex:1;display:flex;justify-content:space-around;text-align:center}
.ig-num b{display:block;font-size:17px;font-weight:700}
.ig-num span{font-size:13px}
.ig-bio{padding:0 16px 12px;font-size:13.5px}
.ig-bio b{display:block;font-weight:600}
.ig-bio .cat{color:#737373}
.ig-bio a{color:#00376b;font-weight:600}
.ig-bts{display:grid;grid-template-columns:1fr 1fr 34px;gap:6px;padding:0 16px 14px}
.ig-bts span{display:grid;place-items:center;background:#efefef;border-radius:8px;font-weight:600;font-size:13.5px;height:32px}
.ig-bts span svg{width:16px;height:16px}
.ig-bts .seg{background:#0095f6;color:#fff}
.ig-dest{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:0 16px 14px}
.ig-dest div{flex:0 0 64px;text-align:center;font-size:12px}
.ig-dest img{display:block;width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid #dbdbdb;padding:2px;background:#fff;margin-bottom:5px}
.ig-abas{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #dbdbdb;position:sticky;top:50px;background:#fff;z-index:1}
.ig-abas span{display:grid;place-items:center;height:44px;color:#737373}
.ig-abas span.on{color:#000;box-shadow:inset 0 -1px 0 #000}
.ig-abas svg{width:22px;height:22px}
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ig-grid button{display:block;aspect-ratio:3/4;overflow:hidden;background:#eee}
.ig-grid img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
.ig-grid button:hover img{opacity:.85}
.ig-nav{position:sticky;bottom:0;display:flex;justify-content:space-around;align-items:center;height:56px;background:#fff;border-top:1px solid #efefef}
.ig-nav svg{width:24px;height:24px}
.ig-nav i{width:26px;height:26px;border-radius:50%;background:#0F2E2F;outline:1.5px solid #000;outline-offset:1.5px}
.ig-notas{display:grid;gap:18px;padding-top:36px}
.ig-notas h2{font-weight:300;font-size:30px;line-height:1.1;letter-spacing:-.015em}
.ig-notas p{color:var(--mut);font-size:15px}
.ig-notas ul{list-style:none;display:grid;gap:12px;font-size:15px}
.ig-notas li{display:grid;grid-template-columns:18px 1fr;gap:6px}
.ig-notas li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--neon);margin-top:8px}
@media (max-width:900px){.perfil-wrap{grid-template-columns:minmax(0,1fr);justify-items:center;gap:28px}.ig-notas{padding-top:0;max-width:440px}}
@media (max-width:600px){.ig-cel{width:100%;max-width:400px;padding:0;background:none;box-shadow:0 20px 50px -30px rgba(15,46,47,.5);border-radius:24px}.ig-cel::before{display:none}.ig{height:76vh;height:76dvh;border-radius:24px}.ig-status{display:none}.ig-abas{top:0}}
/* visualizador */
.vis{position:fixed;inset:0;z-index:10;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);background:rgba(9,24,25,.98);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.vis.aberto{opacity:1;visibility:visible;transition:opacity .25s}
.vis-barra{display:flex;align-items:center;gap:10px;padding:14px 18px;color:var(--branco)}
.vis-barra b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vis-barra code{font-family:"GG Mono",monospace;font-size:12px;opacity:.65}
.vis-barra a,.vis-barra button{color:var(--branco);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;transition:background-color .15s}
.vis-barra a:hover,.vis-barra button:hover{background:rgba(255,255,255,.12)}
.vis-palco{position:relative;display:grid;place-items:center;padding:0 72px 24px;min-height:0;min-width:0;overflow:hidden}
.vis-palco img{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 96px);max-height:calc(100dvh - 96px);object-fit:contain;border-radius:10px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);transform:scale(.97);transition:transform .35s var(--chega)}
.vis.aberto .vis-palco img{transform:none}
.seta{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);color:var(--branco);font-size:22px;display:grid;place-items:center;transition:background-color .15s}
.seta:hover{background:rgba(255,255,255,.22)}
.seta.ant{left:12px}.seta.prox{right:12px}
@media (max-width:600px){.topo{padding-top:28px}.grade{grid-template-columns:repeat(2,1fr);gap:10px}.feed{gap:2px}.peca .leg{padding:9px 10px 11px}.peca b{font-size:13px}.vis-palco{padding:0 8px 16px}.seta{display:none}.vis-barra code{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="topo">
    <div>
      <a class="volta" href="./"><img src="../assets/img/logo-petroNeon.svg" alt="Good Green"><span>Hub</span></a>
      <h1>Criativos</h1>
      <p class="sub">Os anúncios do funil e os posts dos 15 primeiros dias do Instagram, exportados do Figma. Clique numa peça para ver em tamanho real e baixar.</p>
    </div>
    <div class="abas" role="tablist" aria-label="Tipo">
      <button role="tab" data-aba="anuncios" aria-selected="true">Anúncios<small id="n-a"></small></button>
      <button role="tab" data-aba="posts" aria-selected="false">Posts Instagram<small id="n-p"></small></button>
      <button role="tab" data-aba="perfil" aria-selected="false">Perfil no Instagram</button>
    </div>
  </header>
  <div class="filtros" id="filtros"></div>
  <main class="grade" id="grade"></main>
</div>
<div class="vis" id="vis" role="dialog" aria-modal="true" aria-label="Peça em tamanho real">
  <div class="vis-barra"><b id="vis-t"></b><code id="vis-c"></code><a id="vis-baixa" download>Baixar</a><button type="button" id="vis-fecha">Fechar</button></div>
  <div class="vis-palco"><button class="seta ant" type="button" aria-label="Anterior">‹</button><img id="vis-img" src="../criativos/anuncios/AD01-p.jpg" alt=""><button class="seta prox" type="button" aria-label="Próxima">›</button></div>
</div>
<script src="criativos.js?v=2"></script>
<script>
(function () {
  var A = window.GG_ANUNCIOS, P = window.GG_POSTS;
  function nomeP(p) { return p.f ? 'Frase do dia' : 'post ' + p.id.split('-')[1]; }
  function arqP(p) { return p.f ? 'GG-FRASE-' + p.id.split('-')[0] : 'GG-POST-' + p.id; }
  var grade = document.getElementById('grade'), filtros = document.getElementById('filtros');
  var aba = 'anuncios', filtro = 'todos', lista = [];
  document.getElementById('n-a').textContent = A.length; document.getElementById('n-p').textContent = P.length;
  function peca(src, titulo, cod, r, i) {
    return '<button class="peca" type="button" data-i="' + i + '" style="--r:' + r + '"><img src="' + src.replace('.jpg', '-p.jpg') + '" alt="' + titulo.replace(/"/g, '&quot;') + '" loading="lazy" decoding="async"><span class="leg"><b>' + titulo + '</b><code>' + cod + '</code></span></button>';
  }
  function filtrosHtml(opcoes) {
    filtros.innerHTML = opcoes.map(function (o) { return '<button type="button" data-f="' + o[0] + '" aria-pressed="' + (o[0] === filtro) + '">' + o[1] + '</button>'; }).join('');
  }
  function desenha() {
    lista = []; var h = '';
    if (aba === 'anuncios') {
      var lps = ['todos'].concat(A.map(function (a) { return a.lp; }).filter(function (v, i, s) { return s.indexOf(v) === i; }));
      filtrosHtml(lps.map(function (l) { return [l, l === 'todos' ? 'Todos' : l]; }).concat([['4:5', 'Feed 4:5'], ['9:16', 'Stories 9:16']]));
      grade.className = 'grade';
      A.forEach(function (a) {
        if (filtro !== 'todos' && a.lp !== filtro && a.f !== filtro) return;
        var src = '../criativos/anuncios/' + a.id + '.jpg';
        lista.push({ src: src, t: a.t, c: a.id + ' · ' + a.lp + ' · ' + a.f });
        h += peca(src, a.t, a.id + ' · ' + a.lp + ' · ' + a.f, a.f === '4:5' ? '4/5' : '9/16', lista.length - 1);
      });
    } else if (aba === 'perfil') {
      filtros.innerHTML = ''; grade.className = 'perfil-wrap';
      var I = function (d) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>'; };
      var dest = [['sabor', 'Sabor'], ['preparo', 'Preparo'], ['garrafa', 'Garrafa'], ['ingredientes', 'Fórmula'], ['rotina', 'Rotina']];
      h = '<div class="ig-cel"><div class="ig" aria-label="Prévia do perfil @goodgreen">'
        + '<div class="ig-status"><span>9:41</span><svg viewBox="0 0 44 14" aria-hidden="true"><rect x="0" y="8" width="3" height="6" rx="1"/><rect x="5" y="5" width="3" height="9" rx="1"/><rect x="10" y="2" width="3" height="12" rx="1"/><rect x="21" y="1.5" width="20" height="11" rx="3" fill="none" stroke="#000"/><rect x="23" y="3.5" width="14" height="7" rx="1.5"/><rect x="42" y="5" width="2" height="4" rx="1"/></svg></div>'
        + '<div class="ig-topo">' + I('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>') + 'goodgreen<svg class="vf" viewBox="0 0 24 24" aria-hidden="true"><path fill="#0095f6" d="M12 1.5l2.6 2 3.3-.3.9 3.2 2.8 1.8-1.2 3.1 1.2 3.1-2.8 1.8-.9 3.2-3.3-.3-2.6 2-2.6-2-3.3.3-.9-3.2-2.8-1.8 1.2-3.1-1.2-3.1 2.8-1.8.9-3.2 3.3.3z"/><path d="M8 12.2l2.6 2.6L16.2 9" stroke="#fff" stroke-width="2" fill="none"/></svg>'
        + '<span class="dir">' + I('<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>') + I('<path d="M4 6h16M4 12h16M4 18h16"/>') + '</span></div>'
        + '<div class="ig-cab"><div class="ig-av"><span><img src="../assets/img/logo-brancoNeon.svg" alt=""></span></div><div class="ig-num"><div><b>' + P.length + '</b><span>posts</span></div><div><b>12,4 mil</b><span>seguidores</span></div><div><b>38</b><span>seguindo</span></div></div></div>'
        + '<div class="ig-bio"><b>Good Green</b><span class="cat">Suplemento alimentar</span><br>Seu verde do dia em um copo. 🌿<br>Daily Functional Drink · abacaxi com hortelã<br>Garrafa de vidro grátis no 1º pedido ↓<br><a>goodgreen.com.br</a></div>'
        + '<div class="ig-bts"><span class="seg">Seguir</span><span>Mensagem</span><span>' + I('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>') + '</span></div>'
        + '<div class="ig-dest">' + dest.map(function (d) { return '<div><img src="../criativos/destaques/' + d[0] + '.jpg" alt="">' + d[1] + '</div>'; }).join('') + '</div>'
        + '<div class="ig-abas"><span class="on">' + I('<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>') + '</span><span>' + I('<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 9l5 3-5 3z"/>') + '</span><span>' + I('<path d="M4 4h16v16H4z"/><circle cx="12" cy="10" r="3"/><path d="M7 18a5 5 0 0 1 10 0"/>') + '</span></div><div class="ig-grid">';
      P.slice().reverse().forEach(function (p) {
        var src = '../criativos/posts/' + p.id + '.jpg', d = p.id.split('-')[0];
        lista.push({ src: src, t: 'Dia ' + (+d.slice(1)) + ' · ' + nomeP(p), c: arqP(p) });
        h += '<button type="button" class="ig-post" data-i="' + (lista.length - 1) + '" aria-label="' + lista[lista.length - 1].t + '"><img src="' + src.replace('.jpg', '-p.jpg') + '" alt="" loading="lazy" decoding="async"></button>';
      });
      h += '</div><div class="ig-nav">' + I('<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>') + I('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>') + I('<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>') + I('<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 9l5 3-5 3z"/>') + '<i></i></div></div></div>'
        + '<div class="ig-notas"><h2>Como o perfil fica depois dos 15 dias</h2><p>Mais recente em cima, três posts por dia formando uma linha. Role dentro do celular e toque num post para abrir em tamanho real.</p>'
        + '<ul><li>O grid do Instagram mostra cada post em 3:4, então o 4:5 perde uma faixa fina em cima e embaixo. Confira se nenhum texto encosta nessas bordas.</li><li>Seguidores, bio e destaques são de protótipo, só para ver a composição.</li><li>Cada linha fecha um dia de conteúdo.</li></ul></div>';
    } else {
      filtrosHtml([['todos', 'Por dia'], ['feed', 'Só o grid']]);
      grade.className = 'grade' + (filtro === 'feed' ? ' feed' : '');
      var itens = P.slice(); if (filtro === 'feed') itens.reverse();
      var dia = '';
      itens.forEach(function (p) {
        var d = p.id.split('-')[0];
        if (d !== dia && filtro !== 'feed') { dia = d; h += '<div class="dia"><h2>Dia ' + (+d.slice(1)) + '</h2><span>3 posts</span></div>'; }
        var src = '../criativos/posts/' + p.id + '.jpg';
        lista.push({ src: src, t: 'Dia ' + (+d.slice(1)) + ' · ' + nomeP(p), c: arqP(p) });
        h += peca(src, p.f ? 'Frase do dia' : 'Post ' + p.id.split('-')[1], arqP(p), '4/5', lista.length - 1);
      });
    }
    grade.innerHTML = h;
  }
  document.querySelectorAll('[data-aba]').forEach(function (b) {
    b.addEventListener('click', function () {
      aba = b.dataset.aba; filtro = 'todos';
      document.querySelectorAll('[data-aba]').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
      try { history.replaceState(null, '', '#' + aba); } catch (e) {}
      desenha();
    });
  });
  filtros.addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (!b) return; filtro = b.dataset.f; desenha(); });
  var vis = document.getElementById('vis'), img = document.getElementById('vis-img'), atual = 0, ultimo = null;
  function mostra(i) {
    atual = (i + lista.length) % lista.length; var it = lista[atual];
    img.src = it.src; img.alt = it.t; document.getElementById('vis-t').textContent = it.t; document.getElementById('vis-c').textContent = it.c;
    var b = document.getElementById('vis-baixa'); b.href = it.src; b.setAttribute('download', it.c.split(' ')[0] + '.jpg');
  }
  function abre(i) { ultimo = document.activeElement; mostra(i); vis.classList.add('aberto'); document.body.style.overflow = 'hidden'; document.getElementById('vis-fecha').focus(); }
  function fecha() { vis.classList.remove('aberto'); document.body.style.overflow = ''; if (ultimo) ultimo.focus(); }
  grade.addEventListener('click', function (e) { var b = e.target.closest('.peca, .ig-post'); if (b) abre(+b.dataset.i); });
  document.getElementById('vis-fecha').addEventListener('click', fecha);
  vis.querySelector('.ant').addEventListener('click', function () { mostra(atual - 1); });
  vis.querySelector('.prox').addEventListener('click', function () { mostra(atual + 1); });
  vis.addEventListener('click', function (e) { if (e.target === vis || e.target.classList.contains('vis-palco')) fecha(); });
  document.addEventListener('keydown', function (e) {
    if (!vis.classList.contains('aberto')) return;
    if (e.key === 'Escape') fecha(); else if (e.key === 'ArrowLeft') mostra(atual - 1); else if (e.key === 'ArrowRight') mostra(atual + 1);
  });
  var x0 = null;
  vis.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  vis.addEventListener('touchend', function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) mostra(atual + (dx < 0 ? 1 : -1)); x0 = null; });
  var alvo = location.hash.slice(1); if (alvo === 'posts' || alvo === 'perfil') document.querySelector('[data-aba="' + alvo + '"]').click(); else desenha();
})();
</script>
</body>
</html>
